# The simulators and benchmarks are research scripts: they draw with random() on purpose and the six designs in
# sim/designs/ are independent copies by construction. Analyse the shipped code (anyp5/, evidence/, templates,
# workflows) and leave those out of the security and duplication checks.
sonar.sources=.
sonar.exclusions=sim/**,bench/**,tests/**
sonar.tests=tests
sonar.cpd.exclusions=sim/**,bench/**,tests/**
sonar.python.version=3.10, 3.11, 3.12
